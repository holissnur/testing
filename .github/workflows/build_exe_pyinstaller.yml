name: Compile with PyInstaller

on:
  workflow_dispatch: # Allows you to trigger this manually from GitHub Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Dependencies and Rebuild Bootloader
      env:
        PYINSTALLER_COMPILE_BOOTLOADER: 1 # Compiles custom bootloader to avoid virus flags
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pymupdf
        pip install --no-binary :all: pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller `
          --onedir `
          --noconsole `
          --name="AutoFill_Script" `
          --contents-directory="DLLSupport" `
          AutoFill_Script.py

    - name: Upload Executable Artifact Folder
      uses: actions/upload-artifact@v4
      with:
        name: AutoFill_PyInstaller_Output
        path: dist/AutoFill_Script/
