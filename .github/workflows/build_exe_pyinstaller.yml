name: Compile with PyInstaller (Signed & Safe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller openpyxl pymupdf

    - name: Build EXE with PyInstaller Folder Layout
      run: |
        pyinstaller `
          --onedir `
          --noconsole `
          --name="AutoFill_Script" `
          --contents-directory="DLLSupport" `
          AutoFill_Script.py

    # FIX: Generate a custom certificate and digitally sign the EXE to fix False Positives
    - name: Digitally Sign Executable
      shell: powershell
      run: |
        echo "Creating self-signed code certificate..."
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=AutoFillUtility" -CertStoreLocation Cert:\CurrentUser\My
        
        echo "Signing the executable file..."
        $exePath = "dist/AutoFill_Script/AutoFill_Script.exe"
        Set-AuthenticodeSignature -FilePath $exePath -Certificate $cert

    - name: Upload Executable Artifact Folder
      uses: actions/upload-artifact@v4
      with:
        name: AutoFill_PyInstaller_Signed
        path: dist/AutoFill_Script/
