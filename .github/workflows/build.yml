name: Compile Python to EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    # High-Speed Cache Engine
    - name: Configure Compiler Cache
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\Nuitka\Nuitka
        key: ${{ runner.os }}-nuitka-v2-${{ hashFiles('AutoFill_Script.py') }}
        restore-keys: |
          ${{ runner.os }}-nuitka-v2-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka openpyxl pymupdf pefile

    - name: Build Executable with Layout
      run: |
        python -m nuitka `
          --standalone `
          --windows-console-mode=disable `
          --enable-plugin=tk-inter `
          --enable-plugin=anti-bloat `
          --lto=no `
          --assume-yes-for-downloads `
          --windows-dependency-tool=pefile `
          --experimental=use_collection_layout=flat-dist-with-internal `
          --company-name="YourNameOrCompany" `
          --product-name="AutoFill Utility" `
          --file-version="1.0.0.0" `
          --product-version="1.0.0.0" `
          --file-description="Automated text processing and file fill tool" `
          --nofollow-import-to=PIL `
          --nofollow-import-to=matplotlib `
          --nofollow-import-to=numpy `
          AutoFill_Script.py

    - name: Clean Output Directory Files
      run: |
        Remove-Item -Path "AutoFill_Script.dist/*.txt" -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "AutoFill_Script.dist/*.json" -Force -ErrorAction SilentlyContinue

    - name: Upload Executable Artifact Folder
      uses: actions/upload-artifact@v4
      with:
        name: AutoFill_Script_Folder
        path: AutoFill_Script.dist/
