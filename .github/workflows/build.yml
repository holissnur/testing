name: Compile Python to EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka pymupdf openpyxl
        # Add any other pip install commands here if your script needs them

    - name: Build EXE with Nuitka
      run: |
        python -m nuitka --standalone --onefile AutoFill_Script.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoFill_Script_EXE
        path: AutoFill_Script.exe
