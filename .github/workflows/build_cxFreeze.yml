name: Compile with cx_Freeze (Strict Clean Root Layout)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Initialize the Microsoft Visual C++ (MSVC) Command Prompt environment variables for cl.exe
    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cx_Freeze openpyxl pymupdf

    - name: Generate cx_Freeze Setup Script
      shell: powershell
      run: |
        @'
        import sys
        from cx_Freeze import setup, Executable

        build_exe_options = {
            "packages": ["os", "sys", "tkinter", "openpyxl", "et_xmlfile", "fitz"],
            "excludes": ["unittest", "test"],
            "zip_include_packages": ["*"],
            "zip_exclude_packages": [],
        }

        base = None 

        setup(
            name="AutoFill_Internal",
            version="1.0",
            options={"build_exe": build_exe_options},
            executables=[Executable("AutoFill_Script.py", base=base, target_name="core_app.exe")],
        )
        '@ | Out-File -FilePath setup.py -Encoding utf8

    - name: Build EXE Base Layout
      run: |
        python setup.py build_exe

    # Staging process to restructure everything into a clean 'lib' folder
    - name: Restructure Folders for Pristine Root
      shell: powershell
      run: |
        $buildDir = "build/exe.win-amd64-3.10"
        $stagingDir = "build/staging_temp"
        
        # 1. Create a pristine staging directory structure outside the build path
        New-Item -ItemType Directory -Force -Path "$stagingDir/lib" | Out-Null
        
        # 2. Move everything from the build folder into the staging lib directory
        Get-ChildItem -Path $buildDir | Move-Item -Destination "$stagingDir/lib"
        
        # 3. Clean up the empty build folder and replace it with the perfect layout
        Remove-Item -Recurse -Force $buildDir
        Move-Item -Path $stagingDir -Destination $buildDir
        
        # Verify the root looks beautifully clean (should only show the 'lib' folder right now)
        Write-Host "--- Verifying Staged Layout (Root) ---"
        Get-ChildItem -Path $buildDir

    # Compile a native C++ launcher to load system DLLs securely from the /lib/ folder
    - name: Compile Native C++ Search-Path Bootstrapper
      shell: powershell
      run: |
        @'
        #include <windows.h>
        #include <string>
        #include <vector>

        int WINAPI WinMain(HINSTANCE hInstance, HINSTANCE hPrevInstance, LPSTR lpCmdLine, int nCmdShow) {
            SetDllDirectoryW(L"lib");
            
            // Use a mutable wchar_t vector buffer to satisfy CreateProcessW's LPWSTR signature
            std::wstring targetPath = L"lib\\core_app.exe";
            std::vector<wchar_t> pathBuffer(targetPath.begin(), targetPath.end());
            pathBuffer.push_back(L'\0'); // Ensure null-termination

            STARTUPINFOW si = { sizeof(si) };
            PROCESS_INFORMATION pi;
            si.dwFlags = STARTF_USESHOWWINDOW;
            si.wShowWindow = SW_HIDE; 

            // Pass the data pointer of the buffer to satisfy the Windows API compiler check
            if (CreateProcessW(NULL, pathBuffer.data(), NULL, NULL, FALSE, 0, NULL, NULL, &si, &pi)) {
                CloseHandle(pi.hProcess);
                CloseHandle(pi.hThread);
            }
            return 0;
        }
        '@ | Out-File -FilePath launcher.cpp -Encoding utf8
        
        # Compile via standard MSVC compiler
        cl.exe /O2 /Fe:build/exe.win-amd64-3.10/AutoFill_Script.exe launcher.cpp /link /SUBSYSTEM:WINDOWS user32.lib kernel32.lib

    # Digitally sign the final wrapper binary to prevent antivirus interference
    - name: Digitally Sign Executable wrapper
      shell: powershell
      run: |
        echo "Creating self-signed code certificate..."
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=AutoFillUtility" -CertStoreLocation Cert:\CurrentUser\My
        
        echo "Signing the executable file..."
        $exePath = "build/exe.win-amd64-3.10/AutoFill_Script.exe"
        Set-AuthenticodeSignature -FilePath $exePath -Certificate $cert

    # Uploads the directory layout containing only AutoFill_Script.exe and the lib directory
    - name: Upload Executable Artifact Folder
      uses: actions/upload-artifact@v4
      with:
        name: AutoFill_StrictClean_Signed
        path: build/exe.win-amd64-3.10/
